services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: servifood
      MYSQL_USER: servifood
      MYSQL_PASSWORD: servifood_local
      MYSQL_ROOT_PASSWORD: local_root_only
    ports:
      - "3306:3306"
    volumes:
      - servifood_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  servifood_mysql_data:

