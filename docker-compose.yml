services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: servifood
      MYSQL_USER: servifood
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD in .env}
    ports:
      - "3306:3306"
    volumes:
      - servifood_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  servifood_mysql_data:

