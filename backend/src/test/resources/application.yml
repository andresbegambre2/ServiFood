spring:
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:h2:mem:servifood;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  cors:
    allowed-origin: http://localhost:5173
  orders:
    allow-when-closed: true
    tracking-secret: test-tracking-secret-with-at-least-32-characters
  uploads:
    receipts-directory: ${java.io.tmpdir}/servifood-test-receipts
    receipts-max-bytes: 5242880
