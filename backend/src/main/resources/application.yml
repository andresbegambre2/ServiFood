spring:
  application:
    name: servifood-api
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/servifood?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USERNAME:servifood}
    password: ${DB_PASSWORD:servifood_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  orders:
    allow-when-closed: ${ALLOW_ORDERS_WHEN_CLOSED:false}
    tracking-secret: ${TRACKING_SECRET:local-development-tracking-secret-change-before-production}
  uploads:
    receipts-directory: ${RECEIPTS_DIRECTORY:./var/receipts}
    receipts-max-bytes: ${RECEIPTS_MAX_BYTES:5242880}
